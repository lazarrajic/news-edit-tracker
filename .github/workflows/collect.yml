name: collect

on:
  schedule:
    # learnt to offset from the hour as GH gets busy and delays by 10 or so min.
    - cron: "15 */2 * * *"
  workflow_dispatch:

# delay the collectors to prevent running at the same time.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run poll
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
